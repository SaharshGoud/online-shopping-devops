<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ShopEase | Online Shopping</title><link rel="stylesheet" href="styles.css">
</head>
<body>
<header><h1>ShopEase</h1><nav><button id="shopTab">Shop</button><button id="cartTab">Cart <span id="cartCount">0</span></button><button id="ordersTab">Orders</button><button id="adminTab">Admin</button></nav><div id="account"></div></header>
<main>
<section id="authPanel" class="panel"><h2>Customer Login / Registration</h2><div class="auth">
<form id="loginForm"><h3>Login</h3><input name="email" type="email" placeholder="Email" required><input name="password" type="password" placeholder="Password" required><button>Login</button></form>
<form id="registerForm"><h3>Create account</h3><input name="name" placeholder="Full name" required><input name="email" type="email" placeholder="Email" required><input name="password" type="password" placeholder="Password (6+ chars)" minlength="6" required><button>Register</button></form></div><p class="hint">Demo admin: admin@shop.com / admin123</p></section>
<section id="shopPanel" class="panel"><div class="sectionHead"><h2>Product Catalogue</h2><input id="search" placeholder="Search products..."></div><div id="products" class="products"></div></section>
<section id="cartPanel" class="panel hidden"><h2>Your Cart</h2><div id="cart"></div><button id="checkout">Checkout / Place Order</button></section>
<section id="ordersPanel" class="panel hidden"><h2>Order History</h2><div id="orders"></div></section>
<section id="adminPanel" class="panel hidden"><h2>Admin Product Management</h2><form id="productForm" class="productForm"><input name="name" placeholder="Product name" required><input name="description" placeholder="Description"><input name="price" type="number" min="1" placeholder="Price" required><input name="stock" type="number" min="0" placeholder="Stock" required><button>Add Product</button></form><div id="adminProducts"></div></section>
<div id="message" role="status"></div>
</main><script src="app.js"></script>
</body></html>
