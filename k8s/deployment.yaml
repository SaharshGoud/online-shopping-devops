apiVersion: apps/v1
kind: Deployment
metadata:
  name: online-shopping
spec:
  replicas: 2
  selector:
    matchLabels:
      app: online-shopping
  template:
    metadata:
      labels:
        app: online-shopping
    spec:
      containers:
        - name: online-shopping
          image: online-shopping:1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          env:
            - name: PORT
              value: "3000"
            - name: DATA_DIR
              value: /data
            - name: SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: shopping-secrets
                  key: session-secret
          volumeMounts:
            - name: shopping-data
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 20
      volumes:
        - name: shopping-data
          persistentVolumeClaim:
            claimName: shopping-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: online-shopping-service
spec:
  type: NodePort
  selector:
    app: online-shopping
  ports:
    - port: 3000
      targetPort: 3000
      nodePort: 30080
